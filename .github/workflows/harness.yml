name: harness

# Harness de engenharia (harness/): cadência própria, fora do gate de release do baseline.
# Não é o self-test: falha aqui não bloqueia tag de segurança (ver harness/README.md).
on:
  push:
    branches: [main]
    paths: ['harness/**', '.github/workflows/harness.yml']
  pull_request:
    branches: [main]
    paths: ['harness/**', '.github/workflows/harness.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: harness/engineering-task-harness

jobs:
  python:
    # 3.9 = /usr/bin/python3 do macOS, usado pelos hooks do Codex e pelo sandbox dele.
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (git_guard, task_harness, session_context)
        run: python -m unittest discover -s tests -v

  shell:
    name: Shell hooks (sh + dash) and shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -qq shellcheck
      - name: Hook tests
        run: sh tests/run_all.sh
