name: Security Scan (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker image name to build and scan (ex: oli-gateway). Leave empty to skip image scan (python-only profile)."
        required: false
        type: string
        default: ""
      dockerfile:
        description: "Path to Dockerfile (relative to repo root)"
        required: false
        type: string
        default: "Dockerfile"
      build-context:
        description: "Docker build context directory"
        required: false
        type: string
        default: "."
      gitleaks-fetch-depth:
        description: "History depth for gitleaks scan (0 = full)"
        required: false
        type: number
        default: 0

# Third-party actions are SHA-pinned (version noted in the trailing comment).
# Tags are mutable; the 2026-03 trivy-action supply-chain incident (all tags
# 0.0.1–0.34.2 compromised) is exactly the attack SHA pins prevent.

# Least-privilege permissions for the reusable workflow.
# Note: the `permissions:` block of a reusable workflow is a hard cap —
# callers cannot elevate beyond what is declared here. Adding more would
# require a new release.
# - contents:read    — checkout
# - pull-requests:read — gitleaks-action@v2 lists PR commits via
#   GET /repos/{owner}/{repo}/pulls/{n}/commits on pull_request events.
permissions:
  contents: read
  pull-requests: read

jobs:
  trivy-image:
    name: Trivy Image Scan
    if: inputs['image-name'] != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image for scanning
        run: |
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ inputs.image-name }}:scan" \
            "${{ inputs.build-context }}"

      # Policy (CI layer): HIGH+CRITICAL with fix available → FAIL
      - name: Trivy scan — HIGH/CRITICAL with fix (fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ inputs.image-name }}:scan"
          format: table
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      # Policy (CI layer): HIGH+CRITICAL without fix → WARN (exit 0)
      - name: Trivy scan — HIGH/CRITICAL without fix (warn)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ inputs.image-name }}:scan"
          format: table
          exit-code: "0"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: false

  gitleaks:
    name: Gitleaks History Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: ${{ inputs.gitleaks-fetch-depth }}

      # v3 = v2 with the runtime moved to Node 24 (no behavior change).
      # Required: GitHub removes Node 20 from hosted runners on 2026-09-16;
      # since 2026-06-02 v2 already needs an opt-out env var to run.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
